name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt pytest
      - name: kordoc(공문서 HWPX·표기 점검) 설치
        run: npm ci
      - name: Python 테스트
        run: python -m pytest -q tests
      - name: 프론트엔드·kordoc 연동 문법 검사
        run: |
          node --check assets/reg_agent.js
          node --check kordoc_core.mjs
          node --check api/kordoc.mjs
      - name: 프론트엔드 로직·kordoc 표기 테스트
        run: node --test tests/js/*.test.mjs
