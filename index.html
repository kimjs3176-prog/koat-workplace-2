<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>규정 제·개정 에이전트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  /* KRDS(대한민국 정부 디자인 시스템) 참조 팔레트 — Primary #256EF4 · Pretendard GOV */
  --g:#256ef4;--gd:#1b5fd9;--gl:#eaf2fe;--gp:#0b4bc2;
  --bg:#fbfbfc;--sf:#ffffff;--bd:rgba(17,18,23,.09);--tx:#1c1d21;--mu:#646b76;--ht:#8b919b;
  --shadow:0 1px 2px rgba(17,18,23,.05);
  --font:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --err-fg:#991b1b;--err-bg:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;}
body.dark{--bg:#0c0d0f;--sf:#161719;--bd:rgba(255,255,255,.09);--tx:#e6e7ea;--mu:#a0a6b0;--ht:#737985;--gl:rgba(37,110,244,.18);--gd:#8fb2fb;--gp:#aecbfd;--err-fg:#fca5a5;--err-bg:#3a1d1d;}

/* 상단바 */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 24px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);}
body.dark .topbar{background:rgba(22,23,25,.88);}
.brand{display:flex;flex-direction:column;line-height:1.2;}
.brand b{font-size:16px;font-weight:800;color:var(--tx);}
.brand span{font-size:11.5px;color:var(--mu);}
.tb-sp{flex:1;}
.tb-btn{font:600 12.5px var(--font);color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none;}
.tb-btn:hover{border-color:var(--g);color:var(--g);}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--mu);border:1px solid var(--bd);}
.badge.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0;}
.badge.no{background:var(--err-bg);color:var(--err-fg);border-color:transparent;}
body.dark .badge.ok{background:#064e3b;color:#a7f3d0;}
@media (max-width:640px){ .topbar{padding:10px 14px;} .brand span,.tb-hide{display:none;} }

.main-content{max-width:1400px;margin:0 auto;padding:20px 24px 40px;}
@media (max-width:640px){ .main-content{padding:14px 14px 32px;} }

/* 패널 머리·공용 버튼(reg_agent.js가 사용) */
.assist-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 14px;}
.assist-h-ic{font-size:20px;align-self:center;}
.assist-h-t{font-size:17px;font-weight:800;color:var(--tx);letter-spacing:-.3px;}
.assist-h-hint{font-size:12.5px;color:var(--mu);}
.assist-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px;color:var(--mu);font-size:13px;}
.spinner{width:14px;height:14px;border:2.5px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.svc-btn{font-size:13px;font-weight:700;border-radius:9px;padding:9px 20px;cursor:pointer;font-family:var(--font);border:1px solid var(--bd);background:var(--sf);color:var(--tx);transition:.12s;}
.svc-btn:hover{border-color:var(--g);color:var(--g);}
.svc-btn.yes{background:var(--g);border-color:var(--g);color:#fff;}
.svc-btn.yes:hover{background:var(--gd);color:#fff;}
.svc-btn.ghost{background:transparent;color:var(--mu);}
.svc-btn.ghost:hover{color:var(--tx);border-color:var(--g);}
.svc-btn.sm{font-size:12px;padding:6px 13px;margin-top:10px;}
.app-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:1300;max-width:min(520px,92vw);
  background:#1f2937;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.3);
  font-size:13px;font-weight:600;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
.app-toast.show{opacity:1;transform:translate(-50%,0);}

/* AI 설정 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--sf);border-radius:14px;width:min(460px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal h2{font-size:16px;font-weight:800;margin-bottom:4px;}
.modal p{font-size:12.5px;color:var(--mu);line-height:1.6;margin-bottom:14px;}
.prov-tabs{display:flex;gap:6px;margin-bottom:12px;}
.prov-tab{flex:1;font:700 13px var(--font);padding:8px;border:1px solid var(--bd);border-radius:9px;background:transparent;color:var(--mu);cursor:pointer;}
.prov-tab.on{background:var(--g);border-color:var(--g);color:#fff;}
.mf{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:12px;font-weight:700;}
.mf input,.mf select{font:13px var(--font);color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;}
.mf a{font-weight:500;color:var(--g);}
.m-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
</style>
<link rel="stylesheet" href="/assets/reg_agent.css">
</head>
<body>
<header class="topbar">
  <span style="font-size:22px" aria-hidden="true">⚖</span>
  <div class="brand"><b>규정 제·개정 에이전트</b><span id="orgSub">내규 제정·개정 실무 지원</span></div>
  <span class="tb-sp"></span>
  <span class="badge" id="badge">● 확인 중</span>
  <button class="tb-btn" onclick="openAiModal()">✦ AI 설정</button>
  <button class="tb-btn" id="darkBtn" onclick="toggleDark()" aria-label="다크 모드 전환">🌙</button>
</header>

<main class="main-content">
  <section id="assistantPanel" aria-label="규정 제·개정 에이전트"></section>
</main>

<div class="modal-bg" id="aiModalBg" onclick="if(event.target===this)closeAiModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aiModalT">
    <h2 id="aiModalT">✦ AI 설정</h2>
    <p>조문 초안·수정안 작성에 쓸 AI를 고르고 API 키를 넣으세요. 키는 이 탭을 닫으면 지워지며(sessionStorage), 요청할 때만 서버로 전달됩니다. Gemini 키가 있으면 유사 규정 의미 검색도 켜집니다.</p>
    <div class="prov-tabs">
      <button class="prov-tab" data-p="gemini" onclick="setProv('gemini')">Gemini</button>
      <button class="prov-tab" data-p="claude" onclick="setProv('claude')">Claude</button>
      <button class="prov-tab" data-p="gpt" onclick="setProv('gpt')">GPT</button>
    </div>
    <label class="mf">API 키 <input id="aiKey" type="password" autocomplete="off" placeholder="키를 붙여 넣으세요"></label>
    <label class="mf">모델 <select id="aiModel"></select></label>
    <div class="mf" id="aiKeyHelp"></div>
    <div class="m-acts">
      <button class="svc-btn ghost" onclick="clearAiSettings()">키 지우기</button>
      <button class="svc-btn" onclick="closeAiModal()">닫기</button>
      <button class="svc-btn yes" onclick="saveAiSettings()">저장</button>
    </div>
  </div>
</div>

<script>
// ── 공용 헬퍼(reg_agent.js가 사용) ──────────────────────────────────────────
let _assistMode='regagent';
function escHtml(s){ if(typeof s!=='string') return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'\\x3C').replace(/\r/g,'\\r').replace(/\n/g,'\\n'); }
function argAttr(v){ return escAttr(jsStr(v)); }
let _toastT=null;
function _toast(msg, ms){
  let t=document.getElementById('appToast');
  if(!t){ t=document.createElement('div'); t.id='appToast'; t.className='app-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'), ms||3500);
}
function _copyFallback(text, ok){
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok&&ok(); }
  catch(e){ alert('복사 실패 — 본문을 직접 선택해 복사하세요.'); }
}
function _copyText(text, ok){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>ok&&ok()).catch(()=>_copyFallback(text,ok)); return; } }catch(e){}
  _copyFallback(text, ok);
}
// 단독 화면이므로 닫기 버튼·작업공간 전환은 없다
function _assistCloseBtn(){ return ''; }
function closeAssist(){}

// ── AI 설정: 키는 sessionStorage(aiKeys), 공급자·모델은 localStorage(aiSettings) ──
const AI_MODELS={
  gemini:[['gemini-flash-latest','최신 Flash (자동 현행화·권장)'],['gemini-pro-latest','최신 Pro (고성능)'],['gemini-2.5-flash','Gemini 2.5 Flash'],['gemini-2.5-pro','Gemini 2.5 Pro']],
  claude:[['claude-sonnet-4-5','Claude Sonnet 4.5 (권장)'],['claude-opus-4-5','Claude Opus 4.5 (최고 성능)'],['claude-haiku-4-5-20251001','Claude Haiku 4.5 (빠름)']],
  gpt:[['gpt-4.1','GPT-4.1 (권장)'],['gpt-4.1-mini','GPT-4.1 Mini (빠름)'],['gpt-4o','GPT-4o']],
};
const AI_HELP={gemini:'https://aistudio.google.com/apikey', claude:'https://console.anthropic.com/settings/keys', gpt:'https://platform.openai.com/api-keys'};
let currentProv='gemini';
function _readAiKeys(){ try{ return JSON.parse(sessionStorage.getItem('aiKeys')||'{}'); }catch(e){ return {}; } }
function _readAiPrefs(){ try{ return JSON.parse(localStorage.getItem('aiSettings')||'{}'); }catch(e){ return {}; } }
function getAiSettings(){ return {..._readAiPrefs(), ..._readAiKeys()}; }
function setProv(p){
  currentProv=p; const s=getAiSettings();
  document.querySelectorAll('.prov-tab').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  document.getElementById('aiKey').value=s['key_'+p]||'';
  const sel=document.getElementById('aiModel');
  sel.innerHTML=AI_MODELS[p].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(s['model_'+p]) sel.value=s['model_'+p]; if(!sel.value) sel.selectedIndex=0;
  document.getElementById('aiKeyHelp').innerHTML=`<a href="${AI_HELP[p]}" target="_blank" rel="noopener">${p==='gpt'?'OpenAI':p==='claude'?'Anthropic':'Google AI Studio'}에서 키 발급 ↗</a>`;
}
function openAiModal(){ const p=_readAiPrefs().provider; setProv(AI_MODELS[p]?p:'gemini'); document.getElementById('aiModalBg').classList.add('show'); setTimeout(()=>document.getElementById('aiKey').focus(),50); }
function closeAiModal(){ document.getElementById('aiModalBg').classList.remove('show'); }
function saveAiSettings(){
  const prefs=_readAiPrefs(), keys=_readAiKeys(), k=document.getElementById('aiKey').value.trim();
  prefs.provider=currentProv; prefs['model_'+currentProv]=document.getElementById('aiModel').value;
  if(k) keys['key_'+currentProv]=k; else delete keys['key_'+currentProv];
  try{ localStorage.setItem('aiSettings', JSON.stringify(prefs)); sessionStorage.setItem('aiKeys', JSON.stringify(keys)); }catch(e){}
  closeAiModal(); _toast(k?'AI 설정을 저장했습니다.':'키가 없어 AI 초안 대신 템플릿·수동 작성으로 동작합니다.');
  if(typeof openRegAgent==='function') openRegAgent();
}
function clearAiSettings(){ try{ sessionStorage.removeItem('aiKeys'); }catch(e){} document.getElementById('aiKey').value=''; _toast('저장된 키를 지웠습니다.'); if(typeof openRegAgent==='function') openRegAgent(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAiModal(); });

// ── 다크 모드·서버 상태 ────────────────────────────────────────────────────
function toggleDark(){
  const dark=!document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  document.getElementById('darkBtn').textContent=dark?'☀️':'🌙';
  try{ localStorage.setItem('darkMode', dark?'1':'0'); }catch(e){}
}
(function(){
  let dark=false; try{ const v=localStorage.getItem('darkMode'); dark=v==='1'||(v==null&&matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){}
  if(dark){ document.body.classList.add('dark'); document.getElementById('darkBtn').textContent='☀️'; }
})();
fetch('/api/ping').then(r=>r.json()).then(d=>{ const b=document.getElementById('badge'); b.textContent=d.ok?'● 서버 연결됨':'● 서버 오류'; b.className='badge '+(d.ok?'ok':'no'); })
  .catch(()=>{ const b=document.getElementById('badge'); b.textContent='● 서버 연결 실패'; b.className='badge no'; });
</script>
<script src="/assets/reg_agent.js"></script>
<script>openRegAgent();</script>
</body>
</html>
