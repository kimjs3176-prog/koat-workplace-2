<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>규정 제·개정 에이전트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  /* KRDS(대한민국 정부 디자인 시스템) 참조 — Primary #256EF4 · Pretendard */
  --g:#256ef4;--gd:#1b5fd9;--gl:#eaf2fe;--gp:#0b4bc2;--g-ring:rgba(37,110,244,.22);
  --bg:#f4f6f9;--sf:#ffffff;--sf2:#f8f9fb;--bd:#e3e7ee;--bd2:#d5dbe5;--tx:#1a1d23;--tx2:#3c4350;--mu:#667080;--ht:#98a1b0;
  --ok:#0f8a5f;--ok-l:#e7f6ef;--warn:#b45309;--warn-l:#fff4e5;--bad:#c62828;--bad-l:#fdecec;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --r:14px;--rs:10px;
  --font:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --err-fg:#b42318;--err-bg:#fdecec;
  --nav-w:264px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;line-height:1.5;}
body.dark{--bg:#0e1013;--sf:#171a1f;--sf2:#1d2127;--bd:#2a2f37;--bd2:#353b45;--tx:#e8eaee;--tx2:#c3c8d0;--mu:#9aa2ae;--ht:#6b7380;--gl:rgba(37,110,244,.16);--gd:#8fb2fb;--gp:#aecbfd;--g-ring:rgba(120,160,255,.3);
  --ok:#5fd3a2;--ok-l:rgba(16,185,129,.14);--warn:#fbbf24;--warn-l:rgba(251,191,36,.12);--bad:#f87171;--bad-l:rgba(248,113,113,.13);--err-fg:#fca5a5;--err-bg:#3a1d1d;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.45);}
svg.ic{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
:focus-visible{outline:3px solid var(--g-ring);outline-offset:2px;}

/* ── 앱 셸: 좌측 내비 + 본문 ───────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh;}
.app-nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px 16px;background:var(--sf);border-right:1px solid var(--bd);overflow-y:auto;}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--g),#5b8ff8);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,110,244,.28);flex-shrink:0;}
.brand-mark svg.ic{width:21px;height:21px;stroke-width:1.9;}
.brand-txt{display:flex;flex-direction:column;min-width:0;}
.brand-txt b{font-size:15.5px;font-weight:800;letter-spacing:-.02em;color:var(--tx);}
.brand-txt span{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-label{font-size:11px;font-weight:700;color:var(--ht);letter-spacing:.04em;padding:8px 10px 4px;}
.ra-nav{display:flex;flex-direction:column;gap:2px;}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;}
.org-card{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--sf2);}
.org-card .oc-n{font-size:13px;font-weight:800;color:var(--tx);}
.org-card .oc-m{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.5;}
.org-card .oc-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--tx2);}
.nav-btns{display:flex;gap:6px;}
.nav-btn{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;font:600 12px var(--font);color:var(--tx2);background:transparent;border:1px solid var(--bd);border-radius:9px;padding:8px 6px;cursor:pointer;text-decoration:none;transition:.12s;white-space:nowrap;}
.nav-btn svg.ic{width:16px;height:16px;}
.nav-btn:hover{border-color:var(--g);color:var(--g);background:var(--gl);}
.nav-btn.icon{flex:0 0 38px;padding:8px 0;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mu);}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ht);}
.badge.ok{color:var(--ok);} .badge.ok::before{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15);}
.badge.no{color:var(--bad);} .badge.no::before{background:var(--bad);}

.main-content{min-width:0;padding:28px 36px 56px;max-width:1480px;width:100%;}

/* 모바일: 상단 고정 바 + 가로 스크롤 메뉴 */
@media (max-width:1023px){
  .app{display:block;}
  .app-nav{position:sticky;top:0;z-index:50;height:auto;flex-direction:column;gap:0;padding:10px 14px 0;border-right:none;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.94);backdrop-filter:blur(10px);overflow:visible;}
  body.dark .app-nav{background:rgba(23,26,31,.94);}
  .brand{padding:0 0 8px;} .brand-mark{width:32px;height:32px;border-radius:9px;} .brand-txt b{font-size:14.5px;}
  .nav-label,.org-card{display:none;}
  .nav-foot{position:absolute;top:10px;right:14px;margin:0;padding:0;}
  .nav-foot .nav-btns{gap:4px;} .nav-foot .nav-btn{flex:0 0 auto;padding:7px 9px;} .nav-foot .nav-btn .lbl{display:none;}
  .ra-nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:8px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px;}
  .ra-nav::-webkit-scrollbar{display:none;}
  .main-content{padding:18px 14px 40px;}
}

/* 공용 버튼·로딩(reg_agent.js) */
.assist-loading{display:flex;align-items:center;justify-content:center;gap:9px;padding:28px;color:var(--mu);font-size:13px;}
.spinner{width:15px;height:15px;border:2.5px solid var(--gl);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
.svc-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;font:700 13px var(--font);border-radius:10px;padding:0 16px;cursor:pointer;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);transition:background .12s,border-color .12s,color .12s,box-shadow .12s;white-space:nowrap;}
.svc-btn:hover{border-color:var(--g);color:var(--g);}
.svc-btn.yes{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 1px 2px rgba(37,110,244,.3);}
.svc-btn.yes:hover{background:var(--gd);border-color:var(--gd);color:#fff;}
body.dark .svc-btn.yes:hover{background:#3b7bf5;}
.svc-btn.ghost{background:transparent;border-color:transparent;color:var(--mu);}
.svc-btn.ghost:hover{color:var(--tx);background:var(--sf2);border-color:var(--bd);}
.svc-btn.sm{height:32px;font-size:12px;padding:0 12px;margin-top:10px;}
.app-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:1300;max-width:min(520px,92vw);
  background:#1f2937;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
.app-toast.show{opacity:1;transform:translate(-50%,0);}

/* AI 설정 */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--sf);border-radius:16px;width:min(480px,100%);padding:24px;box-shadow:var(--shadow-lg);border:1px solid var(--bd);}
.modal h2{font-size:17px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.modal p{font-size:12.5px;color:var(--mu);line-height:1.65;margin-bottom:16px;}
.prov-tabs{display:flex;gap:4px;margin-bottom:14px;padding:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:11px;}
.prov-tab{flex:1;font:700 13px var(--font);padding:8px;border:none;border-radius:8px;background:transparent;color:var(--mu);cursor:pointer;}
.prov-tab.on{background:var(--sf);color:var(--g);box-shadow:var(--shadow);}
.mf{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--tx2);}
.mf input,.mf select{font:13px var(--font);color:var(--tx);background:var(--sf);border:1px solid var(--bd2);border-radius:10px;padding:0 12px;height:40px;}
.mf input:focus,.mf select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px var(--g-ring);}
.mf a{font-weight:600;color:var(--g);text-decoration:none;}
.m-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
</style>
<link rel="stylesheet" href="/assets/reg_agent.css">
</head>
<body>
<div class="app">
<aside class="app-nav" aria-label="메뉴">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg></div>
    <div class="brand-txt"><b>규정 제·개정 에이전트</b><span id="orgSub">내규 제정·개정 실무 지원</span></div>
  </div>
  <div class="nav-label">작업</div>
  <nav class="ra-nav" id="raNav" role="tablist" aria-label="에이전트 기능"></nav>
  <div class="nav-foot">
    <div class="org-card" id="orgCard"><div class="oc-n">기관 정보 불러오는 중…</div></div>
    <div class="nav-btns">
      <a class="nav-btn" href="/upload" title="제정·개정된 내규 원문을 올려 에이전트 데이터를 최신으로 유지(관리자)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span class="lbl">내규 등록</span></a>
      <button class="nav-btn" onclick="openAiModal()" title="AI 설정"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span class="lbl">AI 설정</span></button>
      <button class="nav-btn icon" id="darkBtn" onclick="toggleDark()" aria-label="다크 모드 전환" title="다크 모드"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
</aside>

<main class="main-content">
  <section id="assistantPanel" aria-label="규정 제·개정 에이전트"></section>
</main>
</div>

<div class="modal-bg" id="aiModalBg" onclick="if(event.target===this)closeAiModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="aiModalT">
    <h2 id="aiModalT"><svg class="ic" viewBox="0 0 24 24" style="color:var(--g)"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>AI 설정</h2>
    <p>조문 초안·수정안 작성에 쓸 AI를 고르고 API 키를 넣으세요. 키는 이 탭을 닫으면 지워지며(sessionStorage), 요청할 때만 서버로 전달됩니다. Gemini 키가 있으면 유사 규정 의미 검색도 켜집니다.</p>
    <div class="prov-tabs">
      <button class="prov-tab" data-p="gemini" onclick="setProv('gemini')">Gemini</button>
      <button class="prov-tab" data-p="claude" onclick="setProv('claude')">Claude</button>
      <button class="prov-tab" data-p="gpt" onclick="setProv('gpt')">GPT</button>
    </div>
    <label class="mf">API 키 <input id="aiKey" type="password" autocomplete="off" placeholder="키를 붙여 넣으세요"></label>
    <label class="mf">모델 <select id="aiModel"></select></label>
    <div class="mf" id="aiKeyHelp"></div>
    <div class="m-acts">
      <button class="svc-btn ghost" onclick="clearAiSettings()">키 지우기</button>
      <button class="svc-btn" onclick="closeAiModal()">닫기</button>
      <button class="svc-btn yes" onclick="saveAiSettings()">저장</button>
    </div>
  </div>
</div>

<script>
// ── 공용 헬퍼(reg_agent.js가 사용) ──────────────────────────────────────────
let _assistMode='regagent';
function escHtml(s){ if(typeof s!=='string') return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/</g,'\\x3C').replace(/\r/g,'\\r').replace(/\n/g,'\\n'); }
function argAttr(v){ return escAttr(jsStr(v)); }
let _toastT=null;
function _toast(msg, ms){
  let t=document.getElementById('appToast');
  if(!t){ t=document.createElement('div'); t.id='appToast'; t.className='app-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'), ms||3500);
}
function _copyFallback(text, ok){
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok&&ok(); }
  catch(e){ alert('복사 실패 — 본문을 직접 선택해 복사하세요.'); }
}
function _copyText(text, ok){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>ok&&ok()).catch(()=>_copyFallback(text,ok)); return; } }catch(e){}
  _copyFallback(text, ok);
}
// 단독 화면이므로 닫기 버튼·작업공간 전환은 없다
function _assistCloseBtn(){ return ''; }
function closeAssist(){}

// ── AI 설정: 키는 sessionStorage(aiKeys), 공급자·모델은 localStorage(aiSettings) ──
const AI_MODELS={
  gemini:[['gemini-flash-latest','최신 Flash (자동 현행화·권장)'],['gemini-pro-latest','최신 Pro (고성능)'],['gemini-2.5-flash','Gemini 2.5 Flash'],['gemini-2.5-pro','Gemini 2.5 Pro']],
  claude:[['claude-sonnet-4-5','Claude Sonnet 4.5 (권장)'],['claude-opus-4-5','Claude Opus 4.5 (최고 성능)'],['claude-haiku-4-5-20251001','Claude Haiku 4.5 (빠름)']],
  gpt:[['gpt-4.1','GPT-4.1 (권장)'],['gpt-4.1-mini','GPT-4.1 Mini (빠름)'],['gpt-4o','GPT-4o']],
};
const AI_HELP={gemini:'https://aistudio.google.com/apikey', claude:'https://console.anthropic.com/settings/keys', gpt:'https://platform.openai.com/api-keys'};
let currentProv='gemini';
function _readAiKeys(){ try{ return JSON.parse(sessionStorage.getItem('aiKeys')||'{}'); }catch(e){ return {}; } }
function _readAiPrefs(){ try{ return JSON.parse(localStorage.getItem('aiSettings')||'{}'); }catch(e){ return {}; } }
function getAiSettings(){ return {..._readAiPrefs(), ..._readAiKeys()}; }
function setProv(p){
  currentProv=p; const s=getAiSettings();
  document.querySelectorAll('.prov-tab').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  document.getElementById('aiKey').value=s['key_'+p]||'';
  const sel=document.getElementById('aiModel');
  sel.innerHTML=AI_MODELS[p].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(s['model_'+p]) sel.value=s['model_'+p]; if(!sel.value) sel.selectedIndex=0;
  document.getElementById('aiKeyHelp').innerHTML=`<a href="${AI_HELP[p]}" target="_blank" rel="noopener">${p==='gpt'?'OpenAI':p==='claude'?'Anthropic':'Google AI Studio'}에서 키 발급 ↗</a>`;
}
function openAiModal(){ const p=_readAiPrefs().provider; setProv(AI_MODELS[p]?p:'gemini'); document.getElementById('aiModalBg').classList.add('show'); setTimeout(()=>document.getElementById('aiKey').focus(),50); }
function closeAiModal(){ document.getElementById('aiModalBg').classList.remove('show'); }
function saveAiSettings(){
  const prefs=_readAiPrefs(), keys=_readAiKeys(), k=document.getElementById('aiKey').value.trim();
  prefs.provider=currentProv; prefs['model_'+currentProv]=document.getElementById('aiModel').value;
  if(k) keys['key_'+currentProv]=k; else delete keys['key_'+currentProv];
  try{ localStorage.setItem('aiSettings', JSON.stringify(prefs)); sessionStorage.setItem('aiKeys', JSON.stringify(keys)); }catch(e){}
  closeAiModal(); _toast(k?'AI 설정을 저장했습니다.':'키가 없어 AI 초안 대신 템플릿·수동 작성으로 동작합니다.');
  if(typeof openRegAgent==='function') openRegAgent();
}
function clearAiSettings(){ try{ sessionStorage.removeItem('aiKeys'); }catch(e){} document.getElementById('aiKey').value=''; _toast('저장된 키를 지웠습니다.'); if(typeof openRegAgent==='function') openRegAgent(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAiModal(); });

// ── 다크 모드·서버 상태 ────────────────────────────────────────────────────
const _SUN='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const _MOON='<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function _darkIcon(d){ const b=document.getElementById('darkBtn'); if(b) b.innerHTML=d?_SUN:_MOON; }
function toggleDark(){
  const dark=!document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  _darkIcon(dark);
  try{ localStorage.setItem('darkMode', dark?'1':'0'); }catch(e){}
}
(function(){
  let dark=false; try{ const v=localStorage.getItem('darkMode'); dark=v==='1'||(v==null&&matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){}
  if(dark){ document.body.classList.add('dark'); _darkIcon(true); }
})();
// 서버 상태는 좌측 기관 카드에 표시(reg_agent.js raOrgCard)
let _srvOk=null;
fetch('/api/ping').then(r=>r.json()).then(d=>{ _srvOk=!!d.ok; if(typeof raOrgCard==='function') raOrgCard(); }).catch(()=>{ _srvOk=false; if(typeof raOrgCard==='function') raOrgCard(); });
</script>
<script src="/assets/reg_agent.js"></script>
<script>openRegAgent();</script>
</body>
</html>
